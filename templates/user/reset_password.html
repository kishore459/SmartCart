<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - SmartCart</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header><div class="logo">SmartCart</div><nav><a href="/user-login">Back to Login</a></nav></header>
    <div class="auth-wrapper"><div class="auth-card">
        <h2>Set a New Password</h2>
        <p style="color: var(--text-muted);">Enter the code sent to {{ email }}. It expires in 10 minutes.</p>
        {% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}<div class="flash-container">{% for category, message in messages %}<div class="flash-message {{ category }}">{{ message }}</div>{% endfor %}</div>{% endif %}{% endwith %}
        <form method="POST" action="/user-reset-password">
            <div class="form-group"><label for="otp">6-Digit Reset Code:</label><input type="text" id="otp" name="otp" class="form-control" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autofocus></div>
            <div class="form-group"><label for="password">New Password:</label><input type="password" id="password" name="password" class="form-control" minlength="8" required></div>
            <div class="form-group"><label for="confirm_password">Confirm New Password:</label><input type="password" id="confirm_password" name="confirm_password" class="form-control" minlength="8" required></div>
            <button type="submit" class="btn btn-primary">Reset Password</button>
        </form>
    </div></div>
</body>
</html>
