<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.name }} Details - SmartCart</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Header containing Navbar Search -->
    <header>
        <div class="logo">
            <a href="/user-dashboard" style="background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 700; font-size: 24px;">🛒 SmartCart</a>
        </div>
        
        <!-- Navbar Search Pill -->
        <div class="header-search">
            <form method="GET" action="/user-dashboard">
                <input type="text" name="search" placeholder="Search product name..." value="{{ request.args.get('search', '') }}">
                <button type="submit">🔍</button>
            </form>
        </div>

        <nav>
            <a href="/user-dashboard">Home</a>
            <a href="/user/my-orders">My Orders</a>
            <a href="/user/cart">
                Cart <span id="cart-count" class="cart-badge">{{ session.get('cart')|length if session.get('cart') else 0 }}</span>
            </a>
            <a href="/user-logout" class="btn btn-outline btn-sm" style="width: auto;">Logout</a>
        </nav>
    </header>

    <div class="container">
        <div style="margin-bottom: 25px;">
            <a href="/user/products" style="font-weight: 500;">&larr; Back to Catalog</a>
        </div>

        <div class="detail-card">
            <!-- Product Gallery/Image -->
            <div class="detail-media" style="height: 350px;">
                <img src="/static/uploads/product_images/{{ product.image }}" alt="{{ product.name }}">
            </div>

            <!-- Product Specs -->
            <div>
                <span style="background: #f1f5f9; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; color: var(--secondary); text-transform: uppercase;">{{ product.category }}</span>
                <h1 class="detail-title">{{ product.name }}</h1>
                <div style="font-size: 28px; font-weight: 700; color: var(--primary); margin-bottom: 25px;">₹{{ "%.2f"|format(product.price) }}</div>

                <h3 style="font-size: 16px; margin-bottom: 10px; color: var(--text-muted); border-bottom: 1px solid var(--border-color); padding-bottom: 8px;">Description</h3>
                <p style="color: #475569; font-size: 16px; margin-bottom: 35px; white-space: pre-line; line-height: 1.7;">{{ product.description }}</p>

                <div class="detail-actions">
                    <button onclick="addToCart({{ product.product_id }})" class="btn btn-primary" style="padding: 14px 30px; flex-grow: 1;">🛒 Add to Cart</button>
                    <a href="{{ url_for('buy_now', product_id=product.product_id) }}" class="btn btn-secondary" style="padding: 14px 30px; flex-grow: 1;">⚡ Buy Now</a>
                    <a href="/user/cart" class="btn btn-outline" style="padding: 14px 20px; width: auto;">Go to Cart</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom Toast Message Popup Container -->
    <div id="toast-message" class="toast-msg"></div>

    <footer>
        &copy; 2026 SmartCart Systems.
    </footer>

    <script>
    function addToCart(productId) {
        fetch(`/user/add-to-cart-ajax/${productId}`)
            .then(response => {
                if (!response.ok) {
                    if (response.status === 401) {
                        window.location.href = '/user-login';
                        throw new Error('Not logged in');
                    }
                    throw new Error('Network error');
                }
                return response.json();
            })
            .then(data => {
                // Update badge cart count
                const badge = document.getElementById("cart-count");
                if (badge) {
                    badge.innerText = data.cart_count;
                }

                // Show toast message
                const toast = document.getElementById("toast-message");
                toast.innerHTML = `<span>✔</span> ${data.message}`;
                toast.classList.add("show");

                // Clear toast after 3s
                setTimeout(() => {
                    toast.classList.remove("show");
                }, 3000);
            })
            .catch(error => console.error("Error adding to cart:", error));
    }
    </script>

</body>
</html>
