<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - SmartCart</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header><div class="logo">SmartCart</div><nav><a href="/user-login">Back to Login</a></nav></header>
    <div class="auth-wrapper"><div class="auth-card">
        <h2>Forgot Password</h2>
        <p style="color: var(--text-muted);">Enter your account email and we'll send a 6-digit reset code.</p>
        {% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}<div class="flash-container">{% for category, message in messages %}<div class="flash-message {{ category }}">{{ message }}</div>{% endfor %}</div>{% endif %}{% endwith %}
        <form method="POST" action="/user-forgot-password">
            <div class="form-group"><label for="email">Email Address:</label><input type="email" id="email" name="email" class="form-control" required autofocus></div>
            <button type="submit" class="btn btn-primary">Send Reset Code</button>
        </form>
    </div></div>
</body>
</html>
